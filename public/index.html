<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b32">
  <title>SchoolSidekick</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/student"><span aria-hidden="true">✦</span> SchoolSidekick</a>
      <nav class="roles" aria-label="Workspaces">
        <a href="/student">Student</a>
        <a href="/teacher">Teacher</a>
      </nav>
    </div>
  </header>
  <main class="layout">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title"></h1>
      <p id="page-description"></p>
    </section>

    <div class="work-area">
      <aside class="sidebar">
        <nav aria-labelledby="tool-heading">
          <h2 id="tool-heading">What are you working on?</h2>
          <div id="tool-menu"></div>
        </nav>
        <a class="saved-link" href="#saved">Saved work <span aria-hidden="true">↘</span></a>
      </aside>

      <section class="workspace" aria-labelledby="active-tool">
        <h2 id="active-tool"></h2>
        <p id="tool-description" class="tool-description"></p>
        <div id="ai-panel">
          <div id="chat" class="chat" role="log" aria-label="School chat" hidden></div>
          <form class="ask-form" id="ask-form">
            <label for="question" id="question-label"></label>
            <textarea id="question" rows="4" maxlength="4000" required aria-describedby="privacy"></textarea>
            <div class="form-actions">
              <button class="example" id="example" type="button">Try an example <span aria-hidden="true">↗</span></button>
              <button class="primary" id="ask" type="submit"></button>
            </div>
            <p class="privacy" id="privacy"></p>
          </form>
          <p class="status" id="status" role="status"></p>
          <section id="quiz-panel" class="quiz-panel" aria-label="Practice quiz" hidden></section>
          <section class="answer" id="answer" aria-labelledby="answer-title" hidden>
            <h3 id="answer-title" tabindex="-1"></h3>
            <div class="answer-text" id="answer-text"></div>
            <details id="answer-key" hidden>
              <summary>Teacher answer key</summary>
              <p id="key-text"></p>
            </details>
            <button class="secondary" type="button" id="save">Save this answer</button>
          </section>
        </div>

        <section id="planner" aria-label="Time organizer calendar" hidden>
          <div class="calendar-toolbar">
            <button class="secondary" id="prev-month" type="button" aria-label="Previous month">‹</button>
            <h3 id="calendar-month" aria-live="polite"></h3>
            <button class="secondary" id="next-month" type="button" aria-label="Next month">›</button>
          </div>
          <div class="calendar-week" aria-hidden="true">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div class="calendar-days" id="calendar-days"></div>
          <h3 id="selected-day"></h3>
          <ul id="day-events" class="day-events"></ul>
          <form id="event-form" class="event-form">
            <label for="event-title">What do you want to remember?</label>
            <div class="event-fields">
              <input id="event-title" maxlength="100" required placeholder="Example: Science quiz">
              <button class="primary" type="submit">Add to calendar</button>
            </div>
          </form>
          <p id="planner-status" class="status" role="status"></p>
        </section>
      </section>
    </div>

    <section class="saved" id="saved" aria-labelledby="saved-title">
      <div class="saved-heading">
        <h2 id="saved-title">Saved work</h2>
        <p>Saves on this computer only for now</p>
      </div>
      <p id="saved-error" role="status" hidden></p>
      <div class="saved-items" id="saved-items"></div>
    </section>
  </main>
</body>
</html>
